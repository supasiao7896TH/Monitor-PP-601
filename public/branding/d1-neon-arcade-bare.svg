<svg viewBox="-60 -60 1320 420" width="1320" height="420" xmlns="http://www.w3.org/2000/svg" >
<style>
.tube   { animation: sc-warm 2.6s steps(1, end) var(--wd, 0s) 1 both; }
.tube-s { animation: sc-stut var(--sp, 13s) steps(1, end) var(--sd, 0s) infinite; }
.tube-b { animation: sc-breathe var(--bp, 6s) ease-in-out var(--bd, 0s) infinite; }
@keyframes sc-warm {
0%   { opacity: 0; }
3%   { opacity: 1; }
6%   { opacity: .06; }
10%  { opacity: .85; }
13%  { opacity: 0; }
21%  { opacity: 1; }
25%  { opacity: .1; }
28%  { opacity: 1; }
32%  { opacity: .35; }
36%  { opacity: 1; }
41%  { opacity: .15; }
46%  { opacity: 1; }
100% { opacity: 1; }
}
/* Lit at 0% so a cancelled animation leaves the sign on. */
@keyframes sc-stut {
0%, 95.6%   { opacity: 1; }
96%         { opacity: .07; }
96.4%       { opacity: 1; }
97.2%       { opacity: .14; }
97.6%, 100% { opacity: 1; }
}
@keyframes sc-breathe {
0%, 100% { opacity: 1; }
50%      { opacity: .87; }
}
@media (prefers-reduced-motion: reduce) {
.tube, .tube-s, .tube-b { animation: none; opacity: 1; }
}
</style>
