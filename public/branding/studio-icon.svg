<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A(i)CODER">
  <title>A(i)CODER — Studio icon</title>
  <rect width="512" height="512" rx="112" fill="#1D4ED8"/>
  <!-- ตัว A วาดเป็นเส้น ไม่ใช่ตัวอักษรจากฟอนต์ จึงหน้าตาเหมือนกันทุกเครื่องและอ่านออกที่ 16px -->
  <path d="M148 382 L256 146 L364 382" fill="none" stroke="#FFFFFF" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M197 296 H315" fill="none" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>
  <!-- จุดอำพัน = (i) ของ A(i)CODER — สีรองของระบบ ทำหน้าที่เดียวกับในแอป คือบอก "ที่มา" -->
  <circle cx="392" cy="150" r="30" fill="#F2B705"/>
</svg>
